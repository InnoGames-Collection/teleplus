# ==============================================================================
# Host Nginx Configuration for TelePlus
# Target: GCP Compute Engine VM (innoserver-serv001: 34.41.116.217)
# Domain: innopulseplatform.com
# Upstreams:
#   - teleplus_web: 127.0.0.1:3500 (20+ Games Casual Web Portal)
#   - teleplus_api: 127.0.0.1:3502 (Fastify Anti-Cheat API)
#   - teleplus_admin: 127.0.0.1:3503 (Telecom Operations Console)
# ==============================================================================

upstream teleplus_web {
    server 127.0.0.1:3500;
    keepalive 32;
}

upstream teleplus_api {
    server 127.0.0.1:3502;
    keepalive 32;
}

upstream teleplus_admin {
    server 127.0.0.1:3503;
    keepalive 16;
}

# 1. Player Portal: teleplus.innopulseplatform.com
server {
    listen 80;
    server_name teleplus.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name teleplus.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://teleplus_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. API Subdomain: teleplus-api.innopulseplatform.com
server {
    listen 80;
    server_name teleplus-api.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name teleplus-api.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
